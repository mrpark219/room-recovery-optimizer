services:
  mysql:
    image: mysql:8.4
    command: [ "--default-time-zone=+00:00" ]
    environment:
      MYSQL_DATABASE: room_recovery
      MYSQL_USER: room_recovery
      MYSQL_PASSWORD: room_recovery
      MYSQL_ROOT_PASSWORD: local_root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "MYSQL_PWD=$${MYSQL_PASSWORD} mysql -h 127.0.0.1 -u $${MYSQL_USER} $${MYSQL_DATABASE} -e 'SELECT 1'" ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 15s
volumes:
  mysql-data:
